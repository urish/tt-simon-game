name: spice

on: [push, workflow_dispatch]

jobs:
  ring_osc:
    runs-on: ubuntu-24.04
    env:
      PDK: gf180mcuD
      PDK_ROOT: /home/runner/.ciel
      GF_VERSION: 61a056e180dac7dcc6d4eb7529e2231f95105746
    steps:
      - uses: actions/checkout@v6

      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install ciel
        run: pip install ciel

      - name: Cache gf180mcu PDK
        id: pdk-cache
        uses: actions/cache@v5
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-61a056e180dac7dcc6d4eb7529e2231f95105746

      - name: Fetch gf180mcu PDK
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: ciel enable --pdk gf180mcu "$GF_VERSION"

      - name: Run ring oscillator SPICE sweep
        working-directory: spice
        run: |
          set -euo pipefail
          echo "PDK_ROOT=$PDK_ROOT  PDK=$PDK"
          ls "$PDK_ROOT/$PDK/libs.tech/ngspice/sm141064.ngspice" >/dev/null

          # Expected ring frequency per corner (MHz), 3.3 V, 14 fF/node.
          declare -A freq_min=( [typical]=80 [ff]=105 [ss]=55 )
          declare -A freq_max=( [typical]=125 [ff]=170 [ss]=95 )

          fail=0
          for corner in typical ff ss; do
            sed "s/\.lib sm141064.ngspice typical/.lib sm141064.ngspice $corner/" ring_osc.spice > "/tmp/ring_${corner}.spice"
            log="/tmp/ring_${corner}.log"
            ngspice -b "/tmp/ring_${corner}.spice" 2>&1 | tee "$log" >/dev/null
            freq=$(grep -E '^fmhz' "$log" | awk '{print $3}' | head -1)
            if [ -z "$freq" ]; then
              echo "::error::corner $corner: ngspice produced no fmhz output"
              tail -50 "$log"; fail=1; continue
            fi
            freq_fmt=$(python3 -c "print(f'{float(\"$freq\"):.0f}')")
            freq_int=$(python3 -c "print(int(round(float('$freq'))))")
            min=${freq_min[$corner]}; max=${freq_max[$corner]}
            status="OK"
            if [ "$freq_int" -lt "$min" ] || [ "$freq_int" -gt "$max" ]; then
              status="OUT OF RANGE [${min}, ${max}] MHz"; fail=1
              echo "::error::corner $corner: ring ${freq_fmt} MHz outside [${min}, ${max}]"
            fi
            echo "$corner @ 3.3 V, 27 °C: ring ${freq_fmt} MHz -- $status"
          done

          {
            echo "## Ring oscillator SPICE sweep (GF180, 3.3 V, 14 fF/node)"
            echo ""
            echo '| Corner | Ring frequency |'
            echo '| --- | --- |'
            for corner in typical ff ss; do
              log="/tmp/ring_${corner}.log"
              freq=$(grep -E '^fmhz' "$log" | awk '{print $3}' | head -1)
              freq_fmt=$(python3 -c "print(f'{float(\"$freq\"):.0f}')")
              printf '| %s @ 3.3 V, 27 °C | %s MHz |\n' "$corner" "$freq_fmt"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" -ne 0 ]; then
            echo "::error::ring oscillator out of expected envelope"; exit 1
          fi

      - name: Upload ngspice logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spice-logs
          path: |
            /tmp/ring_*.log
            /tmp/ring_*.spice
